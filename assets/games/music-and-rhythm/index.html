<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>汪汪飞盘公园 · 高清像素版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{ --ink:#2b3a55; --sky:#cdeaf5; --butter:#ffcd5c; --coral:#ff828c; --grass:#96cd8c; --sand:#f7e6c5; }
  html,body{ height:100%; overflow:hidden; font-family:"Courier New",monospace; }
  body{ background:var(--ink); display:flex; align-items:center; justify-content:center; user-select:none; touch-action:manipulation; }
  #scaler{ transform-origin:center center; flex:none; }
  #stage{ position:relative; width:960px; height:600px; background:var(--sky); overflow:hidden; cursor:pointer; }
  #stage.shake{ animation:shake .3s steps(6); }
  @keyframes shake{ 0%{transform:translate(0,0);} 20%{transform:translate(-6px,3px);} 40%{transform:translate(5px,-3px);} 60%{transform:translate(-4px,2px);} 80%{transform:translate(3px,-2px);} 100%{transform:translate(0,0);} }
  img, .tile{ image-rendering:pixelated; image-rendering:crisp-edges; }

  .px{ border:4px solid var(--ink); box-shadow:6px 6px 0 rgba(43,58,85,.35); background:#fff; border-radius:0; }

  /* ---------- scenery ---------- */
  #sun{ position:absolute; top:26px; right:56px; width:78px; animation:bob 3.2s steps(4) infinite; }
  .cloud{ position:absolute; width:120px; animation:drift linear infinite; }
  @keyframes drift{ from{ transform:translateX(-160px);} to{ transform:translateX(1120px);} }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(8px);} }
  .tree{ position:absolute; bottom:172px; width:108px; }
  #park{ position:absolute; bottom:0; left:0; right:0; height:190px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAV0lEQVR4nGOcdrbnPwMFgIkSzSgGPHr+ZIBdICcpQ5QGdJdSzwXEAnSXMjEwkB+ABF1AjMFM2JxFNRfgMxjmOgwDSA0PsqMR5joMA3A5G5fL6JeQcLkMAOkTGA57liCQAAAAAElFTkSuQmCC); background-size:48px 48px; border-top:4px solid var(--ink); }
  #path{ position:absolute; bottom:28px; left:0; right:0; height:94px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAU0lEQVR4nGP8/uzofwYKABMlmok24PXzB5QZICqpQJwB+GwiygB8NhFlADlgYAxADiuyDEAOK9p5gdgoxWkAsVFKkhewuYoJlwQ2gM1VTLgkiAUA4eEVwWAKuzcAAAAASUVORK5CYII=); background-size:48px 48px; border-top:4px solid var(--ink); border-bottom:4px solid var(--ink); }

  /* ---------- characters ---------- */
  .duo{ position:absolute; bottom:66px; width:200px; height:160px; transform:translateX(-50%); }
  .duo .walker{ position:absolute; right:0; bottom:0; width:72px; transition:transform .12s; }
  .duo .walker.bounce{ transform:translateY(-10px); }
  .duo .leash{ position:absolute; left:46px; bottom:46px; width:84px; height:4px; background:var(--ink); transform:rotate(-4deg); }
  .duo .dog{ position:absolute; left:0; bottom:0; width:96px; will-change:transform; }
  .tag{ position:absolute; bottom:-36px; left:10px; padding:3px 14px; font-weight:bold; font-size:17px;
    color:var(--ink); background:var(--butter); border:4px solid var(--ink); box-shadow:4px 4px 0 rgba(43,58,85,.35); transform:rotate(-3deg); }

  #coach{ position:absolute; left:2%; bottom:94px; width:78px; }
  #frisbee{ position:absolute; width:60px; margin:-18px 0 0 -30px; display:none; will-change:transform,left,top; z-index:5; }

  /* ---------- HUD & feedback ---------- */
  #hud{ position:absolute; top:14px; left:14px; padding:8px 16px; font-weight:bold; color:var(--ink); font-size:17px; display:flex; gap:20px; }
  #combo{ position:absolute; top:96px; left:50%; transform:translateX(-50%); font-size:30px; font-weight:bold; color:var(--ink);
    text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff; opacity:0; transition:opacity .2s; }
  .judge{ position:absolute; transform:translate(-50%,0); padding:7px 16px; font-weight:bold; font-size:20px; color:var(--ink);
    animation:jud .6s steps(6) forwards; pointer-events:none; z-index:8; }
  @keyframes jud{ 0%{ transform:translate(-50%,14px) scale(.6); opacity:0;} 25%{ opacity:1; transform:translate(-50%,0) scale(1.1);} 100%{ transform:translate(-50%,-30px) scale(1); opacity:0;} }
  .bubble{ position:absolute; padding:5px 14px; font-weight:bold; font-size:16px; color:var(--ink); background:#fff;
    border:4px solid var(--ink); box-shadow:4px 4px 0 rgba(43,58,85,.35); z-index:8; animation:bub .7s steps(7) forwards; pointer-events:none; }
  @keyframes bub{ 0%{ transform:scale(.5); opacity:0;} 20%{ transform:scale(1.05); opacity:1;} 80%{ opacity:1;} 100%{ opacity:0; } }
  .star{ position:absolute; width:16px; height:16px; background:var(--butter); z-index:9;
    clip-path:polygon(50% 0,63% 35%,100% 38%,72% 60%,82% 100%,50% 76%,18% 100%,28% 60%,0 38%,37% 35%);
    animation:starfly .6s steps(6) forwards; pointer-events:none; }
  @keyframes starfly{ 0%{ transform:translate(0,0) scale(.6); opacity:1;} 100%{ transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0; } }

  /* ---------- overlays ---------- */
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; z-index:10; background:rgba(43,58,85,.45); }
  .card{ padding:28px 40px; text-align:center; color:var(--ink); position:relative; max-width:540px; }
  .card h1{ font-size:32px; letter-spacing:2px; }
  .card p{ margin-top:12px; font-size:16px; line-height:1.8; }
  .btn{ margin-top:20px; padding:13px 40px; font-size:20px; font-weight:bold; color:var(--ink); background:var(--butter);
    border:4px solid var(--ink); box-shadow:5px 5px 0 rgba(43,58,85,.5); cursor:pointer; font-family:inherit; transition:transform .06s; }
  .btn:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 rgba(43,58,85,.5); }
  #results{ display:none; }
  .stars{ font-size:40px; letter-spacing:10px; margin-top:6px; color:var(--butter); text-shadow:3px 3px 0 var(--ink); }
  .stat{ display:flex; justify-content:space-between; gap:40px; font-size:16px; margin-top:5px; }
  .hidden{ display:none !important; }
  .demoStrip{ margin-top:14px; font-size:14px; background:var(--sand); border:3px dashed var(--ink); padding:8px 14px; }
  .rotateTip{ display:none; margin-top:10px; font-size:14px; opacity:.75; }
  @media (orientation:portrait) and (max-width:820px){ .rotateTip{ display:block; } }
</style>
</head>

<script>
(() => {
"use strict";

/* ================= 音乐引擎：慢摇爵士流行 92bpm ================= */
const BPM = 92, BEAT = 60/BPM, SWING = 0.66;
let ctx=null, master=null, songStart=0, schedTimer=null, nextBeat=0, nextEvt=0;
const mtof = m => 440*Math.pow(2,(m-69)/12);
const CHORDS = [
  {root:38, voice:[50,57,60,65]},
  {root:43, voice:[55,59,62,65]},
  {root:36, voice:[48,55,59,64]},
  {root:33, voice:[45,52,60,64]},
];
function initAudio(){
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.5;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp); comp.connect(ctx.destination);
}
function env(g,t,a,d,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function tone(freq,t,dur,type,peak,filterHz){
  const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=freq;
  let node=o; if(filterHz){ const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filterHz; o.connect(f); node=f; }
  node.connect(g); g.connect(master); env(g,t,0.01,dur,peak); o.start(t); o.stop(t+dur+0.1);
}
function epChord(voice,t,dur,peak){ voice.forEach((m,i)=>{ tone(mtof(m),t+i*0.012,dur,"triangle",peak,1800); tone(mtof(m)*2.001,t+i*0.012,dur*0.6,"square",peak*0.12,2600); }); }
function bass(m,t){ tone(mtof(m),t,0.5,"triangle",0.36,600); }
function noiseHit(t,len,hp,vol){
  const buf=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ctx.createBufferSource(); s.buffer=buf;
  const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
  const g=ctx.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function hat(t,open){ noiseHit(t, open?0.2:0.05, 7500, open?0.09:0.07); }
function kick(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine";
  o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  o.connect(g); g.connect(master); env(g,t,0.004,0.16,0.5); o.start(t); o.stop(t+0.3); }
function bell(m,t,peak){ tone(mtof(m),t,0.4,"square",peak*0.6,3600); tone(mtof(m)*2,t,0.15,"square",peak*0.2,5000); }
function click(t){ tone(1100,t,0.05,"square",0.12,3000); }
function bark(t,base){ tone(base,t,0.07,"square",0.14,1600); tone(base*0.8,t+0.07,0.09,"square",0.12,1400); }
function yip(t){ tone(880,t,0.05,"square",0.10,2400); tone(1100,t+0.06,0.06,"square",0.10,2600); }
function whistle(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="square";
  o.frequency.setValueAtTime(1500,t); o.frequency.linearRampToValueAtTime(2100,t+0.12); o.frequency.linearRampToValueAtTime(1700,t+0.22);
  o.connect(g); g.connect(master); env(g,t,0.02,0.3,0.10); o.start(t); o.stop(t+0.4); }
function womp(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sawtooth";
  o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(90,t+0.4);
  const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=800;
  o.connect(f); f.connect(g); g.connect(master); env(g,t,0.02,0.45,0.2); o.start(t); o.stop(t+0.6); }
function whine(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle";
  o.frequency.setValueAtTime(700,t); o.frequency.linearRampToValueAtTime(420,t+0.5);
  o.connect(g); g.connect(master); env(g,t,0.05,0.5,0.10); o.start(t); o.stop(t+0.7); }

const beatTime = b => songStart + b*BEAT;

function scheduleBeat(b){
  const t = beatTime(b);
  if(b < 4){ click(t); return; }
  const loopBeat = (b-4) % 8;
  const chord = CHORDS[Math.floor(loopBeat/2)];
  bass(loopBeat%2===0 ? chord.root : chord.root+7, t);
  if(loopBeat%4===0 || loopBeat%4===2) kick(t);
  hat(t, loopBeat%2===1);
  hat(t + BEAT*SWING, false);
  if(loopBeat===0) epChord(chord.voice, t, 1.4, 0.15);
  if(loopBeat===3) epChord(chord.voice, t + BEAT*SWING, 0.7, 0.10);
  if(loopBeat===6) epChord(chord.voice, t, 0.9, 0.12);
}

/* ================= 关卡 ================= */
const PATTERNS = {
  single:  { taps:[0],          gap:1,   len:4 },
  double:  { taps:[0,SWING],    gap:1.0, len:4 },
  slow:    { taps:[0],          gap:1.5, len:6 },
  triple:  { taps:[0,0.5,1],    gap:1.5, len:6 },
};
const SEQ = ["single","single","single","double","double","single","slow","double","slow","triple","double","triple"];

let rounds=[], npcEvents=[], playerTaps=[];
function buildLevel(){
  rounds=[]; npcEvents=[]; playerTaps=[];
  let base = 4;
  SEQ.forEach((name,ri)=>{
    const p=PATTERNS[name];
    const throwT = base + 0;
    const c = i => base + 1 + i*p.gap;
    const round = { name, base, throwT, ri, fail:false, hits:[[],[],[]] };
    for(let i=0;i<3;i++) p.taps.forEach(o=>round.hits[i].push(c(i)+o));
    round.end = round.hits[2][round.hits[2].length-1];
    rounds.push(round);
    npcEvents.push({b:throwT, type:"throw"});
    for(let i=0;i<2;i++) round.hits[i].forEach((b,ti)=>npcEvents.push({b, type:"npc", ch:i, ti}));
    round.hits[2].forEach((b,ti)=>playerTaps.push({b, round, ti, judged:false, result:null}));
    base += 1 + p.len;
  });
  npcEvents.sort((a,b)=>a.b-b.b);
}
let LAST_BEAT=0;

function schedulerLoop(){
  const horizon = ctx.currentTime + 0.15;
  while(beatTime(nextBeat) < horizon){
    if(nextBeat <= LAST_BEAT + 8) scheduleBeat(nextBeat);
    nextBeat++;
  }
  while(nextEvt < npcEvents.length && beatTime(npcEvents[nextEvt].b) < horizon){
    const e = npcEvents[nextEvt++];
    const t = beatTime(e.b);
    if(e.type==="throw") whistle(t);
    else bark(t, e.ch===0 ? 520 : 640);
  }
}

const duos=[0,1,2].map(i=>document.getElementById("duo"+i));
const dogs=duos.map(d=>d.querySelector(".dog"));
const walkers=duos.map(d=>d.querySelector(".walker"));

/* ---- 姿势管理：每个角色一个还原计时器，互不打架 ---- */
const dogT=[0,0,0], walkT=[0,0,0]; let coachT=0;
function setDog(i,pose,ms){
  clearTimeout(dogT[i]);
  dogs[i].src = dogs[i].dataset[pose] || dogs[i].dataset.stand;
  if(ms) dogT[i]=setTimeout(()=>{ dogs[i].src=dogs[i].dataset.stand; },ms);
}
function setWalker(i,pose,ms){
  clearTimeout(walkT[i]);
  walkers[i].src = walkers[i].dataset[pose] || walkers[i].dataset.idle;
  if(ms) walkT[i]=setTimeout(()=>{ walkers[i].src=walkers[i].dataset.idle; },ms);
}
function setCoach(pose,ms){
  clearTimeout(coachT);
  coach.src=COACH_SRC[pose]||COACH_SRC.idle;
  if(ms) coachT=setTimeout(()=>{ coach.src=COACH_SRC.idle; },ms);
}
function walkerBounce(i){
  walkers[i].classList.add("bounce");
  setTimeout(()=>walkers[i].classList.remove("bounce"),150);
}
function dogHop(i,big){
  const d=dogs[i];
  setDog(i,"jump",340);
  d.style.transition="none"; d.style.transform="translateY(0)";
  requestAnimationFrame(()=>{
    d.style.transition="transform .12s steps(4)";
    d.style.transform="translateY("+(big?-62:-44)+"px)";
    setTimeout(()=>{ d.style.transition="transform .18s steps(5)"; d.style.transform="translateY(0)"; },130);
  });
}
function dogHopSmall(i){
  const d=dogs[i];
  d.style.transition="none"; d.style.transform="translateY(0)";
  requestAnimationFrame(()=>{
    d.style.transition="transform .1s steps(3)";
    d.style.transform="translateY(-18px)";
    setTimeout(()=>{ d.style.transition="transform .14s steps(4)"; d.style.transform="translateY(0)"; },110);
  });
}

/* ---- 全场反馈 ---- */
function reactPerfect(){
  setTimeout(()=>setDog(2,"happy",700),250);          /* 落地后开心脸 */
  [0,1].forEach(i=>{
    setDog(i,"happy",650); dogHopSmall(i);
    setWalker(i,"cheer",650); walkerBounce(i);
  });
  setWalker(2,"cheer",650); walkerBounce(2);
  setCoach("cheer",650);
  yip(ctx.currentTime+0.15);
}
function reactGood(){
  setTimeout(()=>setDog(2,"happy",400),250);
  setWalker(2,"cheer",450);
  [0,1].forEach(i=>setDog(i,"happy",350));
}
function reactMiss(){
  setDog(2,"sad",1500);
  [0,1].forEach(i=>{ setDog(i,"shock",1100); setWalker(i,"slump",1100); });
  setWalker(2,"slump",1100);
  setCoach("sad",1100);
  whine(ctx.currentTime+0.1);
  stage.classList.add("shake"); setTimeout(()=>stage.classList.remove("shake"),320);
}

const W_PERFECT=0.075, W_GOOD=0.15;
let score=0, combo=0, maxCombo=0, nP=0, nG=0, nM=0, best=0;
let playing=false, raf=0, firedVis=0;

const px = frac => stage.clientWidth * frac;
const charX = i => duos[i].offsetLeft - 78;
const groundY = () => stage.clientHeight - 160;
const frisY0 = () => stage.clientHeight - 250;
const arcH = () => Math.min(200, stage.clientHeight*0.36);

function bubble(txt,x,y){
  const b=document.createElement("div"); b.className="bubble"; b.textContent=txt;
  b.style.left=x+"px"; b.style.top=y+"px"; stage.appendChild(b);
  setTimeout(()=>b.remove(),750);
}
function judgeText(txt,bg,x){
  const j=document.createElement("div"); j.className="judge px"; j.textContent=txt; j.style.background=bg;
  j.style.left=x+"px"; j.style.top=(groundY()-140)+"px"; stage.appendChild(j);
  setTimeout(()=>j.remove(),650);
}
function starBurst(x,y){
  for(let i=0;i<6;i++){
    const s=document.createElement("div"); s.className="star";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.background=["#ffcd5c","#ff828c","#8fd3b6"][i%3];
    s.style.setProperty("--dx",(Math.cos(i/6*6.28)*72)+"px");
    s.style.setProperty("--dy",(Math.sin(i/6*6.28)*72-40)+"px");
    stage.appendChild(s); setTimeout(()=>s.remove(),650);
  }
}
function setCombo(n){
  combo=n; maxCombo=Math.max(maxCombo,combo);
  if(combo>=2){ comboEl.textContent=combo+" 连击!"; comboEl.style.opacity=1; }
  else comboEl.style.opacity=0;
}

/* ---------- 飞盘轨迹 ---------- */
function roundWaypoints(r){
  const wp=[{b:r.throwT+0.1, x:px(0.07)}];
  for(let i=0;i<3;i++) r.hits[i].forEach(b=>wp.push({b, x:charX(i)+28}));
  return wp;
}
function frisbeePos(r, nowB){
  const wp = roundWaypoints(r);
  if(r.fail && nowB > r.failB){
    const t=(nowB-r.failB);
    return { x: r.failX + t*px(0.28), y: frisY0() - 30 + t*90, rot:t*260, gone:t>1.6 };
  }
  if(nowB <= wp[0].b) return null;
  for(let k=0;k<wp.length-1;k++){
    const a=wp[k], b2=wp[k+1];
    if(nowB<=b2.b){
      const f=(nowB-a.b)/(b2.b-a.b);
      const h = (b2.b-a.b) > 0.9 ? arcH() : arcH()*0.45;
      return { x:a.x+(b2.x-a.x)*f, y:frisY0() - Math.sin(f*Math.PI)*h, rot:nowB*180, gone:false };
    }
  }
  const last=wp[wp.length-1], t=nowB-last.b;
  if(r.fail) return null;
  return { x:last.x + t*px(0.10), y:frisY0() - t*260, rot:t*300, gone:t>1.4 };
}

/* ---------- 判定 ---------- */
function playerHit(){
  if(!playing) return;
  const now=ctx.currentTime;
  dogHop(2,false);
  let bestTap=null, bestErr=1e9;
  for(const tp of playerTaps){
    if(tp.judged) continue;
    const err=Math.abs(now-beatTime(tp.b));
    if(err<bestErr){ bestErr=err; bestTap=tp; }
  }
  if(!bestTap || bestErr>W_GOOD+0.06) return;
  bestTap.judged=true;
  const xx=charX(2)+34;
  if(bestErr<=W_PERFECT){
    bestTap.result="P"; nP++; score+=300+combo*10; setCombo(combo+1);
    judgeText("完美!","var(--butter)",xx);
    bell(84+(bestTap.ti*4), now, 0.28); bark(now,760);
    starBurst(xx, groundY()-150); dogHop(2,true);
    reactPerfect();
  }else if(bestErr<=W_GOOD){
    bestTap.result="G"; nG++; score+=100+combo*5; setCombo(combo+1);
    judgeText("不错","var(--grass)",xx);
    bell(72+(bestTap.ti*4), now, 0.2); dogHop(2,true);
    reactGood();
  }else{
    failTap(bestTap); return;
  }
  scoreEl.textContent=score;
}
function failTap(tp){
  tp.judged=true; tp.result="M"; nM++; setCombo(0);
  const r=tp.round;
  if(!r.fail){
    r.fail=true; r.failB=tp.b; r.failX=charX(2)+28;
    womp(ctx.currentTime);
    judgeText("哎呀…","var(--coral)",charX(2)+34);
    bubble("汪?!", charX(2)-6, groundY()-140);
    reactMiss();
    playerTaps.forEach(o=>{ if(o.round===r && !o.judged){ o.judged=true; o.result="M"; nM++; } });
  }
}

/* ================= 主循环 ================= */
let curRoundIdx=0;
function loop(){
  if(!playing) return;
  const now=ctx.currentTime, nowB=(now-songStart)/BEAT;

  while(firedVis < npcEvents.length && beatTime(npcEvents[firedVis].b) <= now){
    const e=npcEvents[firedVis++];
    if(e.type==="throw"){
      setCoach("throw",200);
      bubble("接住~!", px(0.05), groundY()-170);
    }else{
      dogHop(e.ch,true);
      walkerBounce(e.ch);
      bubble("汪!", charX(e.ch)+14, groundY()-150);
    }
  }
  for(const tp of playerTaps){
    if(!tp.judged && now > beatTime(tp.b)+W_GOOD+0.02) failTap(tp);
  }
  while(curRoundIdx<rounds.length-1 && nowB > rounds[curRoundIdx].end+2) curRoundIdx++;
  const r=rounds[curRoundIdx];
  const p=frisbeePos(r,nowB);
  if(p && !p.gone){
    fris.style.display="block";
    fris.style.left=p.x+"px"; fris.style.top=p.y+"px";
    fris.style.transform="rotate("+(Math.round(Math.sin(p.rot/57)*3)*5)+"deg)";
  }else fris.style.display="none";

  if(playerTaps.every(t=>t.judged) && nowB > LAST_BEAT+3){ endGame(); return; }
  raf=requestAnimationFrame(loop);
}

function endGame(){
  playing=false; clearInterval(schedTimer);
  const total=nP+nG+nM, acc= total? (nP+nG*0.5)/total : 0;
  let grade,stars;
  if(acc>=0.92 && nM===0){ grade="太棒了!!"; stars="★★★"; }
  else if(acc>=0.75){ grade="很不错!"; stars="★★☆"; }
  else if(acc>=0.5){ grade="还行!"; stars="★☆☆"; }
  else { grade="再练练…"; stars="☆☆☆"; }
  /* 谢幕：按成绩摆姿势 */
  if(acc>=0.75){ [0,1,2].forEach(i=>{ setDog(i,"happy",2500); setWalker(i,"cheer",2500); }); setCoach("cheer",2500); }
  else if(acc<0.5){ setDog(2,"sad",2500); setWalker(2,"slump",2500); setCoach("sad",2500); }
  best=Math.max(best,score); bestEl.textContent=best;
  document.getElementById("grade").textContent=grade;
  document.getElementById("starRow").textContent=stars;
  document.getElementById("rPerfect").textContent=nP;
  document.getElementById("rGood").textContent=nG;
  document.getElementById("rMiss").textContent=nM;
  document.getElementById("rCombo").textContent=maxCombo;
  document.getElementById("rScore").textContent=score;
  results.style.display="flex";
}

function startGame(){
  if(!ctx) initAudio();
  ctx.resume();
  title.classList.add("hidden"); results.style.display="none";
  [0,1,2].forEach(i=>{ setDog(i,"stand"); setWalker(i,"idle"); }); setCoach("idle");
  score=0; nP=nG=nM=0; setCombo(0); maxCombo=0; scoreEl.textContent=0;
  buildLevel();
  LAST_BEAT = rounds[rounds.length-1].end;
  songStart=ctx.currentTime+0.4; nextBeat=0; nextEvt=0; firedVis=0; curRoundIdx=0;
  schedTimer=setInterval(schedulerLoop,25);
  playing=true; raf=requestAnimationFrame(loop);
}

/* ---- 适配任何屏幕：整体等比缩放 ---- */
const scaler=document.getElementById("scaler");
function fitStage(){
  const s=Math.min(window.innerWidth/960, window.innerHeight/600);
  scaler.style.transform="scale("+s+")";
}
window.addEventListener("resize",fitStage);
window.addEventListener("orientationchange",()=>setTimeout(fitStage,200));
fitStage();

document.getElementById("startBtn").addEventListener("click",e=>{e.stopPropagation();startGame();});
document.getElementById("againBtn").addEventListener("click",e=>{e.stopPropagation();startGame();});
stage.addEventListener("pointerdown",()=>{ if(playing) playerHit(); });
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); if(playing) playerHit(); else if(!title.classList.contains("hidden")) startGame(); }
});
})();
