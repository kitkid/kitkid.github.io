<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵捉迷藏 — Purr &amp; Seek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF7EC;
  --ink:#5C5470;
  --ink-soft:#8B819B;
  --rose:#F2A9A9;
  --rose-deep:#E48989;
  --butter:#FFD98E;
  --sage:#A9CFA0;
  --sky:#BFE3EE;
  --card:#FFFFFF;
  --shadow:0 8px 24px rgba(92,84,112,.16);
  --round:22px;
  --display:'ZCOOL KuaiLe', 'Baloo 2', 'PingFang SC', 'Microsoft YaHei', cursive;
  --body:'Quicksand', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:var(--display); cursor:pointer; border:none;}

/* ---------- intro ---------- */
#intro{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 20% 15%, #FFE9C7 0, transparent 40%),
    radial-gradient(circle at 85% 80%, #D8EFD2 0, transparent 45%),
    var(--paper);
  text-align:center; padding:24px;
  transition:opacity .6s ease, visibility .6s;
}
#intro.hidden{opacity:0; visibility:hidden;}
#intro h1{
  font-family:var(--display); font-weight:800;
  font-size:clamp(2.6rem, 8vw, 4.6rem);
  margin:.2em 0 0; color:var(--ink);
  letter-spacing:.5px;
}
#intro h1 .amp{color:var(--rose-deep);}
#intro p.tag{margin:.4em 0 1.6em; font-size:1.05rem; color:var(--ink-soft); font-weight:600;}
.big-btn{
  background:var(--rose); color:#fff;
  font-size:1.35rem; font-weight:700;
  padding:.7em 2.2em; border-radius:999px;
  box-shadow:0 6px 0 var(--rose-deep), var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.big-btn:hover{transform:translateY(-2px);}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--rose-deep);}
#introCat{width:min(300px,60vw); margin-bottom:6px;}
#intro .hint-line{margin-top:1.6em; font-size:.85rem; color:var(--ink-soft);}

/* ---------- game frame ---------- */
#game{max-width:1080px; margin:0 auto; padding:14px 14px 40px; display:none;}
#game.show{display:block;}

#topbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 4px 12px;
}
#chapterTitle{
  font-family:var(--display); font-weight:800; font-size:1.5rem; margin:0;
  display:flex; align-items:baseline; gap:.5em;
}
#chapterTitle .num{
  font-size:.8rem; background:var(--butter); color:#8a6a2f;
  padding:.15em .8em; border-radius:999px; font-weight:700; align-self:center;
}
#counter{font-weight:700; color:var(--ink-soft); font-size:.95rem;}
#topbar .spacer{flex:1;}
.icon-btn{
  background:#fff; border-radius:999px; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); font-size:1.2rem;
  transition:transform .12s;
}
.icon-btn:hover{transform:scale(1.08);}
.icon-btn:active{transform:scale(.94);}
.pill-btn{
  background:#fff; border-radius:999px; height:44px; padding:0 18px;
  display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow); font-size:1rem; font-weight:700; color:var(--ink);
  transition:transform .12s;
}
.pill-btn:hover{transform:scale(1.05);}

#portraits{
  display:flex; gap:10px; flex-wrap:wrap; padding:0 4px 12px;
}
.chip{
  width:58px; height:70px; background:#fff; border-radius:18px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:transform .25s ease;
  position:relative;
}
.chip svg{width:40px; height:34px;}
.chip .nm{font-size:.58rem; font-weight:700; color:var(--ink-soft); letter-spacing:.2px;}
.chip.found{background:#FFF2D9;}
.chip.found .nm{color:var(--ink);}
.chip.found::after{
  content:"♥"; position:absolute; top:-6px; right:-4px;
  background:var(--rose-deep); color:#fff; font-size:.6rem;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.chip.pop{animation:chipPop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes chipPop{0%{transform:scale(1)}45%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}

#stage{
  position:relative; border-radius:var(--round); overflow:hidden;
  box-shadow:var(--shadow); background:#fff;
  user-select:none;
  touch-action:none;
  cursor:grab;
}
#stage:active{cursor:grabbing;}
#stage svg{display:block; width:100%; height:auto;}

#zoomCtrl{
  position:absolute; right:10px; bottom:10px; z-index:5;
  display:flex; flex-direction:column; gap:6px;
}
.zbtn{
  width:40px; height:40px; border-radius:13px;
  background:rgba(255,255,255,.92); box-shadow:var(--shadow);
  font-size:1.15rem; font-weight:800; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s;
}
.zbtn:hover{transform:scale(1.08);}
.zbtn:active{transform:scale(.92);}

/* ---------- pop-up storybook ---------- */
#storyModal{
  position:fixed; inset:0; z-index:80; display:none;
  align-items:center; justify-content:center; padding:14px;
  background:rgba(40,35,60,.72); backdrop-filter:blur(4px);
}
#storyModal.show{display:flex;}
#bookWrap{width:min(720px,96vw); display:flex; flex-direction:column; gap:12px; align-items:center;}
#book{
  width:100%; aspect-ratio:4/3; position:relative;
  perspective:1700px;
}
.page{
  position:absolute; inset:0; border-radius:20px; overflow:hidden;
  background:#FFF9EC; box-shadow:0 14px 40px rgba(30,25,50,.4);
  display:flex; flex-direction:column;
  transform-origin:left center; transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:transform .75s cubic-bezier(.4,.1,.3,1);
  border-left:6px solid #E8D9BC;
}
.page.past{transform:rotateY(-112deg);}
.page .scene3d{
  flex:1.25; position:relative; perspective:900px; transform-style:preserve-3d;
  overflow:hidden;
}
.bkpop{
  position:absolute; transform-origin:50% 100%;
  transform:rotateX(82deg) translateY(14px); opacity:0;
  transition:transform .8s cubic-bezier(.34,1.35,.64,1), opacity .45s ease;
  will-change:transform;
}
.bkpop svg{display:block; width:100%; height:auto;
  filter:drop-shadow(0 6px 8px rgba(50,40,80,.22));}
.page.current .bkpop{transform:rotateX(0) translateY(0); opacity:1;}
.page .ptext{
  flex:1; padding:14px 26px 18px; text-align:center;
  background:linear-gradient(#FFFDF6,#FBF2DE);
  border-top:2px dashed #EBD9B8;
}
.page .ptext h3{
  font-family:var(--display); font-size:1.3rem; margin:.1em 0 .3em; color:var(--ink);
}
.page .ptext p{
  margin:0; font-size:.92rem; line-height:1.85; color:#75688A; font-weight:500;
  max-width:56ch; margin-inline:auto;
}
.pbtns{display:flex; gap:12px; justify-content:center; margin-top:12px;}
#bookNav{display:flex; align-items:center; gap:14px;}
#dots{display:flex; gap:7px;}
#dots i{
  width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.4);
  transition:background .3s, transform .3s;
}
#dots i.on{background:#FFD98E; transform:scale(1.3);}
@media (max-width:560px){
  .page .ptext p{font-size:.8rem; line-height:1.7;}
  .page .ptext h3{font-size:1.1rem;}
}

/* found / hint animations on inner cat group */
.catInner{transform-box:fill-box; transform-origin:50% 100%;}
.eyesHappy{display:none;}
.cat .blush{opacity:0;}
.cat.found .eyesOpen{display:none;}
.cat.found .eyesHappy{display:block;}
.cat.found .blush{opacity:1; transition:opacity .4s;}
.cat.found .catInner{animation:foundBounce .85s cubic-bezier(.34,1.56,.64,1);}
@keyframes foundBounce{
  0%{transform:scale(1,1)}
  25%{transform:scale(1.2,.78)}
  50%{transform:scale(.88,1.16) translateY(-6px)}
  70%{transform:scale(1.06,.94)}
  100%{transform:scale(1,1)}
}
.cat.wiggle .catInner{animation:wiggle .7s ease;}
@keyframes wiggle{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-5deg)}
  50%{transform:rotate(5deg)}
  75%{transform:rotate(-3deg)}
}
.twinkle{animation:tw 2.4s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

/* hearts overlay */
#fx{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.heart{
  position:absolute; font-size:20px; color:var(--rose-deep);
  animation:floatUp 1.15s ease-out forwards;
}
@keyframes floatUp{
  0%{transform:translate(0,0) scale(.4) rotate(0); opacity:0;}
  15%{opacity:1;}
  100%{transform:translate(var(--dx), -90px) scale(1.15) rotate(var(--rot)); opacity:0;}
}

/* name toast */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 140%);
  background:#fff; border-radius:24px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:14px;
  padding:12px 22px 12px 12px; z-index:60; max-width:min(480px, 92vw);
  transition:transform .45s cubic-bezier(.34,1.4,.64,1);
}
#toast.show{transform:translate(-50%, 0);}
#toast .face{
  width:56px; height:56px; border-radius:50%; background:#FFF2D9; flex:none;
  display:flex; align-items:center; justify-content:center;
}
#toast .face svg{width:44px; height:38px;}
#toast .tname{font-family:var(--display); font-weight:800; font-size:1.1rem; margin:0;}
#toast .trel{margin:2px 0 0; font-size:.85rem; color:var(--ink-soft); font-weight:600; line-height:1.35;}

/* modals */
.modal{
  position:fixed; inset:0; z-index:70; display:none;
  align-items:center; justify-content:center; padding:20px;
  background:rgba(92,84,112,.35); backdrop-filter:blur(3px);
}
.modal.show{display:flex;}
.modal .card{
  background:var(--card); border-radius:28px; box-shadow:var(--shadow);
  padding:30px 30px 26px; max-width:420px; width:100%; text-align:center;
  animation:cardIn .5s cubic-bezier(.34,1.45,.64,1);
}
@keyframes cardIn{0%{transform:translateY(30px) scale(.9); opacity:0}100%{transform:none; opacity:1}}
.card h2{font-family:var(--display); font-weight:800; margin:.2em 0 .1em; font-size:1.6rem;}
.card p{color:var(--ink-soft); font-weight:600; margin:.4em 0 1.2em; line-height:1.5;}
.sticker{
  width:150px; height:150px; margin:6px auto 10px;
  animation:stickerSpin .9s cubic-bezier(.34,1.4,.64,1);
  filter:drop-shadow(0 6px 10px rgba(92,84,112,.25));
}
@keyframes stickerSpin{0%{transform:scale(0) rotate(-140deg)}100%{transform:scale(1) rotate(0)}}

/* album */
#albumGrid{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin:10px 0 18px;}
.slot{
  width:110px; height:130px; border-radius:20px; background:#F6EEDF;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:2px dashed #E3D5BC;
}
.slot svg{width:74px; height:74px;}
.slot .sn{font-size:.68rem; font-weight:700; color:var(--ink-soft);}
.slot.empty svg{opacity:.18; filter:grayscale(1);}
.slot.earned{border-style:solid; border-color:var(--butter); background:#FFF6DF;}

footer{
  text-align:center; color:var(--ink-soft); font-size:.8rem; font-weight:600;
  padding:24px 10px 30px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<div id="intro">
  <svg id="introCat" viewBox="0 0 220 150"></svg>
  <h1>喵喵<span class="amp">·</span>捉迷藏</h1>
  <p class="tag">二十一只小猫藏了起来,你能把每一位朋友都找出来吗?</p>
  <button class="big-btn" id="startBtn">开始寻找 🐾</button>
  <p class="hint-line">小提示:猫猫最喜欢躲在灌木、木桶和暖暖的屋顶上,留意小耳朵和尾巴!<br>画面可以拖动,滚轮或双指还能放大细看哦。</p>
</div>

<!-- ============ GAME ============ -->
<div id="game">
  <div id="topbar">
    <h2 id="chapterTitle"><span class="num">第 1 章</span><span id="chName">阳光花园</span></h2>
    <span id="counter">已找到 0 / 5 位朋友</span>
    <div class="spacer"></div>
    <button class="pill-btn" id="hintBtn" title="会有一只猫猫扭一扭">🐾 提示</button>
    <button class="icon-btn" id="albumBtn" title="贴纸收藏册">📖</button>
    <button class="icon-btn" id="muteBtn" title="声音开关">🔊</button>
  </div>
  <div id="portraits"></div>
  <div id="stage">
    <div id="sceneHolder"></div>
    <div id="fx"></div>
    <div id="zoomCtrl">
      <button class="zbtn" id="zin" title="放大">＋</button>
      <button class="zbtn" id="zout" title="缩小">－</button>
      <button class="zbtn" id="zreset" title="复位">⌂</button>
    </div>
  </div>
  <footer>用胡须和阳光做成的小游戏,每一只猫都在等你。♥</footer>
</div>

<!-- name toast -->
<div id="toast">
  <div class="face"><svg id="toastFace" viewBox="0 0 100 84"></svg></div>
  <div>
    <p class="tname" id="toastName">麻糬</p>
    <p class="trel" id="toastRel">温柔的大姐姐。</p>
  </div>
</div>

<!-- reward modal -->
<div class="modal" id="rewardModal">
  <div class="card">
    <svg class="sticker" id="rewardSticker" viewBox="0 0 120 120"></svg>
    <h2 id="rewardTitle">本章完成!</h2>
    <p id="rewardText">你获得了向日葵徽章。</p>
    <button class="big-btn" id="nextBtn">下一章 →</button>
  </div>
</div>

<!-- album modal -->
<div class="modal" id="albumModal">
  <div class="card">
    <h2>贴纸收藏册</h2>
    <p>每一次寻找留下的小小纪念。</p>
    <div id="albumGrid"></div>
    <button class="big-btn" id="albumClose">继续寻找</button>
  </div>
</div>

<!-- pop-up storybook -->
<div id="storyModal">
  <div id="bookWrap">
    <div id="book"></div>
    <div id="bookNav">
      <button class="pill-btn" id="pgPrev">‹ 上一页</button>
      <div id="dots"></div>
      <button class="pill-btn" id="pgNext">下一页 ›</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   helpers
========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, children = []) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  for (const c of children) n.appendChild(c);
  return n;
}
function grp(attrs = {}, children = []) { return el('g', attrs, children); }
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   cat drawing
   palette per cat: { fur, belly, ear, patches? }
========================================================= */
function catFace(g, p, cx, cy, r) {
  // eyes open
  const open = grp({ class: 'eyesOpen' }, [
    el('circle', { cx: cx - r * .38, cy: cy - r * .05, r: r * .11, fill: '#4A4159' }),
    el('circle', { cx: cx + r * .38, cy: cy - r * .05, r: r * .11, fill: '#4A4159' }),
    el('circle', { cx: cx - r * .34, cy: cy - r * .09, r: r * .04, fill: '#fff' }),
    el('circle', { cx: cx + r * .42, cy: cy - r * .09, r: r * .04, fill: '#fff' }),
  ]);
  // happy eyes ^ ^
  const happy = grp({ class: 'eyesHappy', fill: 'none', stroke: '#4A4159',
    'stroke-width': r * .09, 'stroke-linecap': 'round' }, [
    el('path', { d: `M ${cx - r * .5} ${cy} q ${r * .12} ${-r * .22} ${r * .24} 0` }),
    el('path', { d: `M ${cx + r * .26} ${cy} q ${r * .12} ${-r * .22} ${r * .24} 0` }),
  ]);
  const blush = grp({ class: 'blush', fill: '#F2A9A9', opacity: 0 }, [
    el('ellipse', { cx: cx - r * .55, cy: cy + r * .22, rx: r * .16, ry: r * .1 }),
    el('ellipse', { cx: cx + r * .55, cy: cy + r * .22, rx: r * .16, ry: r * .1 }),
  ]);
  const nose = el('path', {
    d: `M ${cx - r * .08} ${cy + r * .16} h ${r * .16} l ${-r * .08} ${r * .1} z`,
    fill: '#E48989'
  });
  const mouth = el('path', {
    d: `M ${cx} ${cy + r * .26} q ${-r * .1} ${r * .14} ${-r * .2} ${r * .04} M ${cx} ${cy + r * .26} q ${r * .1} ${r * .14} ${r * .2} ${r * .04}`,
    fill: 'none', stroke: '#4A4159', 'stroke-width': r * .05, 'stroke-linecap': 'round'
  });
  const whisk = grp({ stroke: 'rgba(74,65,89,.45)', 'stroke-width': r * .04, 'stroke-linecap': 'round' }, [
    el('line', { x1: cx - r * .95, y1: cy + r * .1, x2: cx - r * .62, y2: cy + r * .14 }),
    el('line', { x1: cx - r * .93, y1: cy + r * .28, x2: cx - r * .6, y2: cy + r * .24 }),
    el('line', { x1: cx + r * .62, y1: cy + r * .14, x2: cx + r * .95, y2: cy + r * .1 }),
    el('line', { x1: cx + r * .6, y1: cy + r * .24, x2: cx + r * .93, y2: cy + r * .28 }),
  ]);
  g.append(open, happy, blush, nose, mouth, whisk);
}

function catEars(g, p, cx, cy, r) {
  const e = (sx) => grp({}, [
    el('path', { d: `M ${cx + sx * r * .78} ${cy - r * .5} L ${cx + sx * r * .55} ${cy - r * 1.28} L ${cx + sx * r * .12} ${cy - r * .88} Z`, fill: p.ear || p.fur }),
    el('path', { d: `M ${cx + sx * r * .6} ${cy - r * .62} L ${cx + sx * r * .5} ${cy - r * 1.05} L ${cx + sx * r * .28} ${cy - r * .82} Z`, fill: '#F6C6C6' }),
  ]);
  g.append(e(-1), e(1));
}

function catPatches(g, p, cx, cy, r) {
  if (!p.patches) return;
  g.append(
    el('path', { d: `M ${cx - r * .1} ${cy - r} A ${r} ${r} 0 0 1 ${cx + r * .85} ${cy - r * .45} L ${cx + r * .2} ${cy - r * .3} Z`, fill: p.patches, opacity: .9 }),
    el('circle', { cx: cx - r * .62, cy: cy - r * .5, r: r * .3, fill: p.patches, opacity: .9 })
  );
}

/* pose builders — origin (0,0) is bottom-center of the cat */
function poseSit(p) {
  const g = grp();
  // tail
  g.append(el('path', {
    d: 'M 26 -8 q 30 -2 32 -30 q 1 -14 -10 -16',
    fill: 'none', stroke: p.fur, 'stroke-width': 11, 'stroke-linecap': 'round'
  }));
  // body
  g.append(el('path', { d: 'M -30 0 Q -34 -52 0 -54 Q 34 -52 30 0 Z', fill: p.fur }));
  g.append(el('path', { d: 'M -30 -2 Q -33 -42 -12 -52 Q -25 -33 -23 -2 Z', fill: 'rgba(58,44,84,.15)' }));
  g.append(el('path', { d: 'M 8 -52 Q 27 -46 29 -16', stroke: 'rgba(255,255,255,.4)', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }));
  g.append(el('ellipse', { cx: 0, cy: -16, rx: 15, ry: 20, fill: p.belly }));
  // front paws
  g.append(
    el('ellipse', { cx: -11, cy: -3, rx: 8, ry: 6, fill: p.fur }),
    el('ellipse', { cx: 11, cy: -3, rx: 8, ry: 6, fill: p.fur })
  );
  // head
  const hy = -68, hr = 22;
  catEars(g, p, 0, hy, hr);
  g.append(el('circle', { cx: 0, cy: hy, r: hr, fill: p.fur }));
  catPatches(g, p, 0, hy, hr);
  g.append(el('path', { d: `M -13 ${hy - 15} Q 0 ${hy - 22} 12 ${hy - 16}`, stroke: 'rgba(255,255,255,.45)', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }));
  g.append(el('ellipse', { cx: 0, cy: hy + hr * .35, rx: hr * .55, ry: hr * .42, fill: p.belly, opacity: .8 }));
  catFace(g, p, 0, hy, hr);
  return g;
}

function poseLoaf(p) {
  const g = grp();
  g.append(el('path', {
    d: 'M -36 0 Q -38 -30 -8 -32 L 22 -32 Q 40 -30 38 0 Z', fill: p.fur
  }));

/* mini head for portraits & toast (viewBox 0 0 100 84) */
function miniHead(p, silhouette) {
  const g = grp();
  const col = silhouette ? { fur: '#D5CEDE', belly: '#E4DEEB', ear: '#D5CEDE' } : p;
  const cx = 50, cy = 46, r = 26;
  catEars(g, col, cx, cy, r);
  g.append(el('circle', { cx, cy, r, fill: col.fur }));
  if (!silhouette) { catPatches(g, p, cx, cy, r); catFace(g, p, cx, cy, r); }
  else g.append(el('text', { x: cx, y: cy + 7, 'text-anchor': 'middle', 'font-size': 22, fill: '#B7AEC4', 'font-family': 'Baloo 2' , 'font-weight':'800'}, [document.createTextNode('?')]));
  return g;
}

/* place a hidden cat into a scene */
function placeCat(root, cat, x, y, scale, pose, flip) {
  const outer = grp({
    class: 'cat', 'data-id': cat.id,
    transform: `translate(${x} ${y}) scale(${(flip ? -scale : scale)} ${scale})`
  });
  const inner = grp({ class: 'catInner', filter: 'url(#roughCat)' });
  inner.append(POSES[pose](cat.pal));
  // generous invisible hit area
  const hitH = pose === 'peek' ? 60 : 100;
  inner.append(el('rect', { x: -46, y: -hitH, width: 92, height: hitH + 12, fill: 'transparent' }));
  outer.append(inner);
  root.append(outer);
  return outer;
}

/* =========================================================
   scenes  (viewBox 0 0 960 600)
========================================================= */
function sceneRoot() {
  const svg = el('svg', { viewBox: '0 0 960 600', 'aria-label': 'hidden object scene' });
  // hand-painted look: turbulence-displaced edges at three scales + paper grain
  const mkRough = (id, freq, scale, seed) => {
    const f = el('filter', { id, x: '-15%', y: '-15%', width: '130%', height: '130%' });
    f.append(el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 2, seed, result: 'n' }));
    f.append(el('feDisplacementMap', { in: 'SourceGraphic', in2: 'n', scale, xChannelSelector: 'R', yChannelSelector: 'G' }));
    return f;
  };
  const paper = el('filter', { id: 'paper', x: '0%', y: '0%', width: '100%', height: '100%' });
  paper.append(el('feTurbulence', { type: 'fractalNoise', baseFrequency: .9, numOctaves: 2, seed: 4 }));
  paper.append(el('feColorMatrix', { type: 'matrix', values: '0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.30  0 0 0 0.10 0' }));
  svg.append(el('defs', {}, [
    mkRough('roughBig', .012, 9, 7),
    mkRough('rough', .03, 5, 11),
    mkRough('roughCat', .06, 2.4, 3),
    paper
  ]));
  return svg;
}
function deco(attrs, children) { const g = grp(attrs, children); g.setAttribute('pointer-events', 'none'); return g; }
function paperGrain(svg) {
  svg.append(deco({}, [el('rect', { width: 960, height: 600, filter: 'url(#paper)' })]));
}

/* irregular painterly blob — a single thick brush daub */
function daub(cx, cy, rx, ry, fill, opacity = 1, rot = 0, jit = .2) {
  const N = 9, pts = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    const jr = 1 + rand(-jit, jit);
    pts.push([Math.cos(a) * rx * jr, Math.sin(a) * ry * jr]);
  }
  let d = '';
  for (let i = 1; i <= N; i++) {
    const p = pts[i % N], q = pts[i - 1];
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    d += (i === 1 ? `M ${(q[0] + pts[N - 1][0]) / 2} ${(q[1] + pts[N - 1][1]) / 2} ` : '') + `Q ${q[0]} ${q[1]} ${mx} ${my} `;
  }
  return el('path', { d: d + 'Z', fill, opacity, transform: `translate(${cx} ${cy}) rotate(${rot})` });
}

/* lighten (amt>0) or darken (amt<0) a hex color */
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt))));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

function cloud(x, y, s, fill) {
  const g = grp({ transform: `translate(${x} ${y}) scale(${s})`, filter: 'url(#rough)' });
  g.append(
    daub(0, 12, 34, 9, 'rgba(120,130,170,.16)'),
    daub(0, 2, 40, 18, fill, .96),
    daub(-26, 8, 24, 12, fill, .92),
    daub(28, 8, 26, 13, fill, .92),
    daub(-6, -7, 22, 10, tint('#FFFFFF', 0), .75)
  );
  return g;
}
function flower(x, y, petal, center) {
  const g = grp({ transform: `translate(${x} ${y})` });
  g.append(el('line', { x1: 0, y1: 0, x2: 0, y2: 18, stroke: '#6FA05B', 'stroke-width': 3.5 }));
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    g.append(daub(Math.cos(a) * 6, Math.sin(a) * 6 - 4, 5.5, 5, petal, .95, 0, .3));

  g.append(daub(0, -4, 4, 4, center, 1, 0, .25));
  return g;
}
function bush(x, y, s, c1, c2) {
  const g = grp({ transform: `translate(${x} ${y}) scale(${s})`, filter: 'url(#rough)' });

}

/* =========================================================
   audio — Web Audio API
========================================================= */
let AC = null, master = null, bgmGain = null, sfxGain = null, muted = false, bgmTimer = null;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  bgmGain = AC.createGain(); bgmGain.gain.value = .5; bgmGain.connect(master);
  sfxGain = AC.createGain(); sfxGain.gain.value = .9; sfxGain.connect(master);
  startBGM();
}

function pluck(freq, t, dur, vol, dest, type = 'triangle') {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + .05);
}

function pad(freqs, t, dur, vol) {
  freqs.forEach(f => {
    const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * .3);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(lp); lp.connect(g); g.connect(bgmGain);
    o.start(t); o.stop(t + dur + .1);
  });
}

/* gentle two-bar loop: Cmaj7 / Am7 / Fmaj7 / G6 */
const CHORDS = [
  [261.63, 329.63, 392.00, 493.88],
  [220.00, 261.63, 329.63, 392.00],
  [174.61, 220.00, 261.63, 349.23],
  [196.00, 246.94, 293.66, 329.63],
];
let barIdx = 0;
function scheduleBar() {
  const beat = 60 / 68;           // slow & breezy
  const barDur = beat * 4;
  const t = AC.currentTime + .08;
  const ch = CHORDS[barIdx % CHORDS.length];
  pad(ch.slice(0, 3).map(f => f / 2), t, barDur, .028);
  // plucked arpeggio, skips a note now and then like a lazy afternoon
  const pattern = [0, 1, 2, 3, 2, 1, 3, 2];
  pattern.forEach((idx, i) => {
    if (Math.random() < .18) return;
    pluck(ch[idx] * 2, t + i * beat / 2, .5, .045, bgmGain);
  });
  if (Math.random() < .4) pluck(ch[3] * 4, t + beat * rand(1, 3), .8, .02, bgmGain, 'sine');
  barIdx++;
  bgmTimer = setTimeout(scheduleBar, barDur * 1000 - 60);
}
function startBGM() { if (!bgmTimer) scheduleBar(); }

/* sfx */
function sfxClick() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(620, t);
  o.frequency.exponentialRampToValueAtTime(240, t + .09);
  g.gain.setValueAtTime(.15, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + .1);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + .12);
}
function sfxChime() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  [659.25, 783.99, 1046.5].forEach((f, i) => pluck(f, t + i * .09, .7, .12, sfxGain, 'triangle'));
}
function sfxMeow(base) {
  if (!AC || muted) return;
  const t = AC.currentTime + .12;
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  const vib = AC.createOscillator(), vg = AC.createGain();
  o.type = 'sawtooth';
  lp.type = 'lowpass'; lp.frequency.value = 1400; lp.Q.value = 2;
  vib.frequency.value = 7; vg.gain.value = base * .03;
  vib.connect(vg); vg.connect(o.frequency);
  // mee — ow
  o.frequency.setValueAtTime(base * .8, t);
  o.frequency.linearRampToValueAtTime(base * 1.5, t + .16);
  o.frequency.linearRampToValueAtTime(base * .65, t + .5);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.14, t + .06);
  g.gain.setValueAtTime(.12, t + .3);
  g.gain.exponentialRampToValueAtTime(.0001, t + .55);
  o.connect(lp); lp.connect(g); g.connect(sfxGain);
  o.start(t); vib.start(t);
  o.stop(t + .6); vib.stop(t + .6);
}
function sfxFanfare() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => pluck(f, t + i * .11, .9, .11, sfxGain));
}
let noiseBuf = null;
function sfxPage() {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .4, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(420, t);
  bp.frequency.exponentialRampToValueAtTime(1900, t + .22);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.09, t + .05);
  g.gain.exponentialRampToValueAtTime(.0001, t + .32);
  src.connect(bp); bp.connect(g); g.connect(sfxGain);
  src.start(t); src.stop(t + .4);
}

/* =========================================================
   game state & flow
========================================================= */
let chapterIdx = 0;
let found = new Set();
const earned = [];

const sceneHolder = $('#sceneHolder');
const fx = $('#fx');
const stage = $('#stage');

/* ---------- pan & zoom viewport ---------- */
let sceneSvg = null;
let view = { x: 0, y: 0, w: 960, h: 600 };
const MIN_W = 300; // max ~3.2x zoom

function applyView() {
  if (sceneSvg) sceneSvg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function clampView() {
  view.w = Math.max(MIN_W, Math.min(960, view.w));
  view.h = view.w * 600 / 960;
  view.x = Math.max(0, Math.min(960 - view.w, view.x));
  view.y = Math.max(0, Math.min(600 - view.h, view.y));
}
function worldPoint(clientX, clientY) {
  const r = sceneSvg.getBoundingClientRect();
  return [view.x + (clientX - r.left) / r.width * view.w,
          view.y + (clientY - r.top) / r.height * view.h];
}
function zoomAt(f, wx, wy) {
  view.x = wx - (wx - view.x) / f;
  view.y = wy - (wy - view.y) / f;
  view.w = view.w / f;
  clampView(); applyView();
}
function resetView() { view = { x: 0, y: 0, w: 960, h: 600 }; applyView(); }

const pointers = new Map();
let gesture = null;

stage.addEventListener('pointerdown', e => {
  initAudio();
  if (e.target.closest('#zoomCtrl') || !sceneSvg) return;
  try { stage.setPointerCapture && stage.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    gesture = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, target: e.target, moved: false };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { pinch: Math.hypot(a.x - b.x, a.y - b.y) };
  }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId) || !sceneSvg || !gesture) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && gesture.pinch === undefined) {
    const r = sceneSvg.getBoundingClientRect();
    if (Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 7) gesture.moved = true;
    view.x = gesture.vx - (e.clientX - gesture.sx) / r.width * view.w;
    view.y = gesture.vy - (e.clientY - gesture.sy) / r.height * view.h;
    clampView(); applyView();
  } else if (pointers.size === 2 && gesture.pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0 && gesture.pinch > 0) {
      const [wx, wy] = worldPoint((a.x + b.x) / 2, (a.y + b.y) / 2);
      zoomAt(d / gesture.pinch, wx, wy);
    }
    gesture.pinch = d;
  }
});
function endPointer(e) {
  const wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (wasSingle && gesture && gesture.pinch === undefined) {
    if (!gesture.moved && gesture.target) handleTap(gesture.target, e);
    gesture = null;
  } else if (pointers.size === 1) {
    const rest = [...pointers.values()][0];
    gesture = { sx: rest.x, sy: rest.y, vx: view.x, vy: view.y, target: null, moved: true };
  } else if (pointers.size === 0) {
    gesture = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', e => {
  if (!sceneSvg) return;
  e.preventDefault();
  const [wx, wy] = worldPoint(e.clientX, e.clientY);
  zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, wx, wy);
}, { passive: false });

$('#zin').addEventListener('click', () => { initAudio(); sfxClick(); zoomAt(1.35, view.x + view.w / 2, view.y + view.h / 2); });
$('#zout').addEventListener('click', () => { initAudio(); sfxClick(); zoomAt(1 / 1.35, view.x + view.w / 2, view.y + view.h / 2); });
$('#zreset').addEventListener('click', () => { initAudio(); sfxClick(); resetView(); });

function handleTap(target, e) {
  const catG = target.closest ? target.closest('.cat') : null;
  if (catG && !found.has(catG.dataset.id)) onFound(catG, e);
  else sfxClick();
}

function loadChapter(i) {
  chapterIdx = i;
  found = new Set();
  const ch = CHAPTERS[i];
  $('#chName').textContent = ch.name;
  $('.num').textContent = '第 ' + (i + 1) + ' 章';
  updateCounter();

  // portraits
  const pr = $('#portraits');
  pr.innerHTML = '';
  ch.cats.forEach(c => pr.append(buildChip(c, false)));

  // scene
  sceneHolder.innerHTML = '';
  const svg = ch.build(ch.cats);
  sceneHolder.append(svg);
  sceneSvg = svg;
  resetView();
}

function updateCounter() {
  $('#counter').textContent = `已找到 ${found.size} / ${CHAPTERS[chapterIdx].cats.length} 位朋友`;
}

function onFound(catG, e) {
  const ch = CHAPTERS[chapterIdx];
  const cat = ch.cats.find(c => c.id === catG.dataset.id);
  found.add(cat.id);
  catG.classList.add('found');
  // portrait chip reveal — rebuild the whole chip node (robust across browsers)
  revealChip(cat);
  sfxChime();
  sfxMeow(cat.meow);
  spawnHearts(e);
  updateCounter();

  // toast
  $('#toastName').textContent = cat.name + ',找到啦!';
  $('#toastRel').textContent = cat.rel;
  const tf = $('#toastFace');
  tf.innerHTML = '';
  tf.append(miniHead(cat.pal, false));
  const toast = $('#toast');
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 4200);

  if (found.size === ch.cats.length) {
    setTimeout(showReward, 1300);
  }
}

/* build a fresh chip element (found or silhouette) */
function buildChip(cat, isFound) {
  const chip = document.createElement('div');
  chip.className = 'chip' + (isFound ? ' found' : '');
  chip.dataset.id = cat.id;
  const s = el('svg', { viewBox: '0 0 100 84' });
  s.append(miniHead(cat.pal, !isFound));
  chip.append(s);
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = isFound ? cat.name : '???';
  chip.append(nm);
  return chip;
}
function revealChip(cat) {
  const old = document.querySelector(`.chip[data-id="${cat.id}"]`);
  if (!old) return;
  const fresh = buildChip(cat, true);
  fresh.classList.add('pop');
  old.replaceWith(fresh);
}

function spawnHearts(e) {
  const rect = $('#stage').getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const glyphs = ['♥', '♥', '✦', '♥', '✧', '♥'];
  for (let i = 0; i < 6; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = glyphs[i];
    h.style.left = (x + rand(-14, 14)) + 'px';
    h.style.top = (y + rand(-10, 6)) + 'px';
    h.style.setProperty('--dx', rand(-46, 46) + 'px');
    h.style.setProperty('--rot', rand(-30, 30) + 'deg');
    h.style.color = i % 2 ? '#E48989' : '#FFC85E';
    h.style.fontSize = rand(15, 26) + 'px';
    fx.append(h);
    setTimeout(() => h.remove(), 1300);
  }
}

function showReward() {
  const ch = CHAPTERS[chapterIdx];
  sfxFanfare();
  earned.push(ch.sticker);
  $('#rewardSticker').replaceChildren(stickerSVG(ch.sticker));
  const last = chapterIdx === CHAPTERS.length - 1;
  $('#rewardTitle').textContent = last ? '所有猫猫都找到了!' : ch.name + ' · 完成!';
  $('#rewardText').textContent = ch.rewardText;
  $('#nextBtn').textContent = last ? '翻开立体绘本 📖' : '下一章 →';
  $('#rewardModal').classList.add('show');
}

$('#nextBtn').addEventListener('click', () => {

});

/* album */
function openAlbum(finale) {
  const grid = $('#albumGrid');
  grid.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const has = earned.includes(ch.sticker);
    const slot = document.createElement('div');
    slot.className = 'slot ' + (has ? 'earned' : 'empty');
    const s = el('svg', { viewBox: '0 0 120 120' });
    s.append(stickerSVG(ch.sticker));
    slot.append(s);
    const nm = document.createElement('span');
    nm.className = 'sn';
    nm.textContent = has ? ch.stickerName : '? ? ?';
    slot.append(nm);
    grid.append(slot);
  });
  $('#albumClose').textContent = finale ? '从花园重新开始' : '继续寻找';
  $('#albumModal').classList.add('show');
  $('#albumClose').onclick = () => {
    sfxClick();
    $('#albumModal').classList.remove('show');
    if (finale) { earned.length = 0; loadChapter(0); }
  };
}

let bookPages = [], bookIdx = 0, bookBuilt = false;

function buildBook() {
  const book = $('#book');
  book.innerHTML = '';
  const dots = $('#dots');
  dots.innerHTML = '';
  bookPages = storyPages().map(pg => {
    const page = document.createElement('div');
    page.className = 'page';
    const sc = document.createElement('div');
    sc.className = 'scene3d';
    sc.style.background = pg.bg;
    pg.layers.forEach(Ld => {
      const d = document.createElement('div');
      d.className = 'bkpop';
      d.style.left = Ld.left; d.style.bottom = Ld.bottom; d.style.width = Ld.width;
      d.style.transitionDelay = `${Ld.delay}s, ${Ld.delay}s`;
      d.append(Ld.node);
      sc.append(d);
    });
    page.append(sc);
    const pt = document.createElement('div');
    pt.className = 'ptext';
    pt.innerHTML = `<h3>${pg.title}</h3><p>${pg.text}</p>`;
    if (pg.last) {
      const bt = document.createElement('div');
      bt.className = 'pbtns';
      const b1 = document.createElement('button');
      b1.className = 'big-btn'; b1.textContent = '查看贴纸册 ✨';
      b1.addEventListener('click', () => {
        sfxClick();
        $('#storyModal').classList.remove('show');
        openAlbum(true);
      });
      const b2 = document.createElement('button');
      b2.className = 'pill-btn'; b2.textContent = '再玩一次';
      b2.addEventListener('click', () => {
        sfxClick();
        $('#storyModal').classList.remove('show');
        earned.length = 0;
        loadChapter(0);
      });
      bt.append(b1, b2);
      pt.append(bt);
    }
    page.append(pt);
    book.append(page);
    dots.append(document.createElement('i'));
    return page;
  });
}

function showBookPage(n) {
  bookIdx = Math.max(0, Math.min(bookPages.length - 1, n));
  bookPages.forEach((p, i) => {
    p.classList.toggle('past', i < bookIdx);
    p.classList.toggle('current', i === bookIdx);
    p.style.zIndex = i < bookIdx ? 60 + i : 40 - i;
  });
  [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === bookIdx));
  $('#pgPrev').style.visibility = bookIdx === 0 ? 'hidden' : 'visible';
  $('#pgNext').style.visibility = bookIdx === bookPages.length - 1 ? 'hidden' : 'visible';
}

function openStorybook() {
  if (!bookBuilt) { buildBook(); bookBuilt = true; }
  $('#storyModal').classList.add('show');
  bookPages.forEach(p => p.classList.remove('current', 'past'));
  requestAnimationFrame(() => requestAnimationFrame(() => showBookPage(0)));
  sfxPage();
}
$('#pgNext').addEventListener('click', () => { sfxPage(); showBookPage(bookIdx + 1); });
$('#pgPrev').addEventListener('click', () => { sfxPage(); showBookPage(bookIdx - 1); });

/* hint */
$('#hintBtn').addEventListener('click', () => {
  initAudio(); sfxClick();
  const ch = CHAPTERS[chapterIdx];
  const hidden = ch.cats.filter(c => !found.has(c.id));
  if (!hidden.length) return;
  const pick = hidden[Math.floor(Math.random() * hidden.length)];
  const g = document.querySelector(`.cat[data-id="${pick.id}"]`);
  if (g) {
    g.classList.remove('wiggle');
    void g.getBoundingClientRect();
    g.classList.add('wiggle');
    setTimeout(() => g.classList.remove('wiggle'), 800);
    sfxMeow(pick.meow); // a helpful little mew from somewhere…
  }
});

/* mute */
$('#muteBtn').addEventListener('click', () => {
  initAudio();
  muted = !muted;
  master.gain.value = muted ? 0 : .9;
  $('#muteBtn').textContent = muted ? '🔇' : '🔊';
});

/* start */
$('#startBtn').addEventListener('click', () => {
  initAudio(); sfxClick();
  $('#intro').classList.add('hidden');
  $('#game').classList.add('show');
  loadChapter(0);
});

/* intro cat art */
(function introArt() {
  const s = $('#introCat');
  const g = grp({ transform: 'translate(70 140)' });
  g.append(poseSit(PALS.cream));
  const g2 = grp({ transform: 'translate(150 140) scale(-0.8 0.8)' });
  g2.append(poseSit(PALS.orange));
  s.append(g2, g);
  // make them look happy
  s.querySelectorAll('.eyesOpen').forEach(n => n.style.display = 'none');
  s.querySelectorAll('.eyesHappy').forEach(n => n.style.display = 'block');
  s.querySelectorAll('.blush').forEach(n => n.style.opacity = 1);
})();
